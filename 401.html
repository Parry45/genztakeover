  <script>
/* ---------- Gen Z Takeover forms: FormSubmit email + Google Sheets ---------- */
(function(){
  var FORMSUBMIT = 'https://formsubmit.co/ajax/thenativeboxx@gmail.com';
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbw2DQ7MM8PBTTaSlvzlM3EluNzleY-sej_R-37UEWPCQUqL7viUvT7BeW9-Hcm4xICP/exec'; // Google Sheet: Gen Z Takeover - Website Submissions
  // Table reservation modal: prefill event + date from the button that opened it
  var modalForm = document.querySelector('[data-gzt-form="Table Reservations"]');
  var label = document.querySelector('[data-reserve-event-label]');
  if (modalForm) {
    var dateInput = modalForm.querySelector('[name="Date"]');
    document.addEventListener('click', function(e){
      var btn = e.target.closest('[data-reserve-event]');
      if (!btn) return;
      var ev = btn.getAttribute('data-reserve-event');
      var hidden = modalForm.querySelector('input[name="Event"]');
      if (hidden) hidden.value = ev;
      if (dateInput && dateInput.options) {
        for (var i = 0; i < dateInput.options.length; i++) { if (dateInput.options[i].value.indexOf(ev) !== -1) { dateInput.selectedIndex = i; break; } }
      }
      if (label) label.textContent = 'For ' + ev + '. Pick your date and we’ll hit you back to confirm.';
      var wrap = modalForm.closest('.w-form');
      if (wrap) {
        modalForm.style.display = '';
        var done = wrap.querySelector('.w-form-done'), fail = wrap.querySelector('.w-form-fail');
        if (done) done.style.display = 'none';
        if (fail) fail.style.display = 'none';
      }
    });
  }
  function formName(form){
    return form.getAttribute('data-gzt-form') || (form.closest('.section_home-updates') ? 'Newsletter Signups' : (form.getAttribute('data-name') || 'Website Form'));
  }
  window.addEventListener('submit', function(e){
    var form = e.target;
    if (!form || form.tagName !== 'FORM' || !form.closest('.w-form')) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var wrap = form.closest('.w-form');
    var done = wrap.querySelector('.w-form-done'), fail = wrap.querySelector('.w-form-fail');
    var btn = form.querySelector('[type="submit"]');
    var btnText = btn ? btn.value : '';
    if (btn) { btn.disabled = true; btn.value = 'Sending…'; }
    var name = formName(form), data = {};
    new FormData(form).forEach(function(v, k){ if (k && k.charAt(0) !== '_') data[k] = v; });
    var payload = Object.assign({}, data, {
      _subject: name === 'Table Reservations' ? 'New table reservation' + (data.Event ? ' — ' + data.Event : '') : 'New ' + name.toLowerCase().replace(/s$/, '') + ' — Gen Z Takeover',
      _template: 'table',
      _captcha: 'false',
      _url: location.href,
      _replyto: data.Email || data.email || '',
      Form: name
    });
    var mail = fetch(FORMSUBMIT, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if (!r.ok || j.success === false || j.success === 'false') throw new Error(j.message || ('Submit failed (' + r.status + ')')); }); });
    var sheet = SHEET_URL ? fetch(SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ sheet: name, page: location.pathname, submittedAt: new Date().toISOString(), data: data }) }).catch(function(){}) : Promise.resolve();
    Promise.all([mail, sheet]).then(function(){
      form.reset();
      form.style.display = 'none';
      if (fail) fail.style.display = 'none';
      if (done) done.style.display = 'block';
    }).catch(function(err){
      console.warn('[GZT form]', err);
      if (fail) {
        var msg = fail.querySelector('div') || fail;
        if (!fail.dataset.orig) fail.dataset.orig = msg.textContent;
        msg.textContent = (err && err.message && /activat/i.test(err.message)) ? 'Almost there — this form is waiting for email activation. Please try again shortly.' : fail.dataset.orig;
        fail.style.display = 'block';
      }
    }).finally(function(){
      if (btn) { btn.disabled = false; btn.value = btnText; }
    });
  }, true);
})();
